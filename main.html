<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            margin-top: 50px;
            background-color: #f4f4f4;
        }
        table {
            width: 70%;
            border-collapse: collapse;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            background-color: white;
        }
        thead {
            background-color: #2c3e50;
            color: white;
        }
        th, td {
            border: 1px solid #dddddd;
            padding: 12px 15px;
            text-align: center;
        }
        th {
            font-size: 16px;
            text-transform: uppercase;
        }
        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tbody tr:hover {
            background-color: #d1e7ff;
        }
        td {
            color: #333;
        }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>Student Name</th>
                <th>Subject</th>
                <th>Marks</th>
                <th>Grade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Rahul Sharma</td>
                <td>Mathematics</td>
                <td>95</td>
                <td>A+</td>
            </tr>
            <tr>
                <td>Priya Singh</td>
                <td>Science</td>
                <td>88</td>
                <td>A</td>
            </tr>
            <tr>
                <td>Aman Verma</td>
                <td>English</td>
                <td>92</td>
                <td>A+</td>
            </tr>
            <tr>
                <td>Neha Gupta</td>
                <td>Computer</td>
                <td>97</td>
                <td>A+</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
